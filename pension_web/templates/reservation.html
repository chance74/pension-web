<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라센느 (La Seine) - 예약 문의</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;500;600&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #FBF9F5; color: #2C2A29; }
        .serif-title { font-family: 'Noto Serif KR', serif; }
    </style>
</head>
<body class="selection:bg-stone-200">

    <!-- 상단 네비게이션 바 -->
    <header class="bg-[#FBF9F5]/90 backdrop-blur-md fixed top-0 left-0 right-0 z-50 border-b border-stone-200/60">
        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
            <a href="/" class="serif-title text-xl font-semibold tracking-widest text-stone-900">LA SEINE</a>
            <nav class="space-x-8 text-sm font-light tracking-wide text-stone-600">
                <a href="/" class="hover:text-stone-900 transition">Home</a>
                <a href="/#about" class="hover:text-stone-900 transition">About</a>
                <a href="/#rooms" class="hover:text-stone-900 transition">Rooms</a>
                <a href="/reservation" class="text-stone-900 font-normal border-b border-stone-900 pb-0.5">Reservation</a>
            </nav>
        </div>
    </header>

    <!-- 예약 페이지 본문 -->
    <main class="pt-32 pb-24 max-w-2xl mx-auto px-6">
        <div class="text-center mb-12">
            <p class="text-xs uppercase tracking-[0.25em] text-stone-400 mb-2">Reservation Inquiry</p>
            <h1 class="serif-title text-3xl md:text-4xl font-light text-stone-800">실시간 예약 문의</h1>
            <p class="text-stone-500 font-light text-sm mt-3">원하시는 객실과 일정을 남겨주시면 빠르게 안내해 드리겠습니다.</p>
        </div>

        <div class="bg-white p-8 md:p-12 border border-stone-200/80 shadow-sm">
            <form class="space-y-6">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 mb-2">Name</label>
                    <input type="text" placeholder="성함을 입력해주세요" class="w-full bg-[#FBF9F5] border border-stone-200 px-4 py-3.5 text-sm focus:outline-none focus:border-stone-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 mb-2">Phone</label>
                    <input type="tel" placeholder="연락처를 입력해주세요 (- 제외)" class="w-full bg-[#FBF9F5] border border-stone-200 px-4 py-3.5 text-sm focus:outline-none focus:border-stone-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 mb-2">Select Room</label>
                    <select class="w-full bg-[#FBF9F5] border border-stone-200 px-4 py-3.5 text-sm focus:outline-none focus:border-stone-500 transition text-stone-700">
                        <option>객실을 선택해주세요</option>
                        {% for room in rooms %}
                        <option>{{ room.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 mb-2">Stay Date</label>
                    <input type="text" placeholder="예: 2026-05-10 ~ 2026-05-11 (1박)" class="w-full bg-[#FBF9F5] border border-stone-200 px-4 py-3.5 text-sm focus:outline-none focus:border-stone-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-stone-500 mb-2">Inquiry / Requests</label>
                    <textarea rows="4" placeholder="기타 문의사항을 남겨주세요" class="w-full bg-[#FBF9F5] border border-stone-200 px-4 py-3.5 text-sm focus:outline-none focus:border-stone-500 transition"></textarea>
                </div>
                <button type="button" onclick="alert('예약 문의가 정상적으로 접수되었습니다!')" 
                        class="w-full bg-stone-900 text-white py-4 text-xs tracking-[0.2em] uppercase hover:bg-stone-800 transition duration-300">
                    Submit Reservation
                </button>
            </form>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-stone-900 text-stone-400 py-12 text-center text-xs font-light tracking-widest">
        <p class="serif-title text-sm text-stone-300 mb-3">LA SEINE PENSION</p>
        <p>© 2026 LA SEINE. All rights reserved.</p>
    </footer>

</body>
</html>
